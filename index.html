<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Approvazione post — AmarantoIdea</title>
<style>
:root{
  --rosso:#9B1B30; --rosso-scuro:#7d1526;
  --inchiostro:#1a1a1a; --grigio:#6b6b6b; --linea:#e3e1de;
  --fondo:#f6f5f3; --carta:#fff; --scarto:#fdf2f4;
  --ok:#2f7d4f;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--inchiostro);font-size:15px;line-height:1.5}

header{position:sticky;top:0;z-index:50;background:var(--carta);border-bottom:1px solid var(--linea);
  box-shadow:0 1px 8px rgba(0,0,0,.05)}
.hwrap{max-width:1500px;margin:0 auto;padding:12px 20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
h1 small{display:block;font-weight:400;font-size:12px;color:var(--grigio);letter-spacing:0}
.conta{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.c{text-align:center;min-width:60px}
.c b{display:block;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.c span{font-size:11px;color:var(--grigio);text-transform:uppercase;letter-spacing:.05em}
.c.neg b{color:var(--rosso)}
.filtri{display:flex;gap:6px;flex-wrap:wrap}
.filtri button{border:1px solid var(--linea);background:var(--carta);border-radius:99px;padding:6px 14px;
  font-size:13px;cursor:pointer;color:var(--grigio);font-family:inherit}
.filtri button[aria-pressed=true]{background:var(--inchiostro);color:#fff;border-color:var(--inchiostro)}
#stato{font-size:12px;color:var(--grigio);min-height:16px}
#stato.ko{color:var(--rosso);font-weight:600}

main{max-width:1500px;margin:0 auto;padding:18px 20px 80px}
.mese{grid-column:1/-1;margin:26px 0 2px;font-size:13px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--grigio);border-bottom:1px solid var(--linea);padding-bottom:6px}
.mese:first-child{margin-top:0}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}

.card{background:var(--carta);border:1px solid var(--linea);border-radius:10px;overflow:hidden;
  display:flex;flex-direction:column;transition:border-color .12s,box-shadow .12s}
.card:hover{box-shadow:0 2px 12px rgba(0,0,0,.07)}
.card.no{background:var(--scarto);border-color:var(--rosso)}
.card.no .foto img{opacity:.42}
.foto{position:relative;cursor:zoom-in;background:#eceae7;aspect-ratio:4/5;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover;display:block;border:0}
.num{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;
  padding:2px 7px;border-radius:99px;font-variant-numeric:tabular-nums}
.bollo{position:absolute;top:8px;right:8px;background:var(--rosso);color:#fff;font-size:11px;
  font-weight:700;padding:3px 9px;border-radius:99px;display:none}
.card.no .bollo{display:block}

.corpo{padding:11px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.quando{font-size:12px;color:var(--grigio);font-variant-numeric:tabular-nums}
.quando b{color:var(--inchiostro);font-weight:600}
.cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--rosso);font-weight:700}
.tit{font-weight:600;font-size:14px;line-height:1.3;margin:0}
.azioni{margin-top:auto;display:flex;gap:8px;align-items:center;padding-top:9px;border-top:1px solid var(--linea)}
.leggi{border:1px solid var(--linea);background:var(--carta);border-radius:7px;padding:6px 10px;font-size:12.5px;
  cursor:pointer;color:var(--inchiostro);font-family:inherit;white-space:nowrap}
.leggi:hover{border-color:var(--grigio)}
.scarta{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;
  user-select:none;padding:5px 8px;border-radius:7px}
.scarta:hover{background:#f0eeec}
.scarta input{width:17px;height:17px;accent-color:var(--rosso);cursor:pointer;margin:0}

dialog{border:0;border-radius:12px;padding:0;max-width:720px;width:92vw;box-shadow:0 18px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.62)}
.dhead{padding:16px 20px 12px;border-bottom:1px solid var(--linea);position:sticky;top:0;background:var(--carta)}
.dhead h2{margin:0 0 3px;font-size:16px}
.dbody{padding:16px 20px 22px;max-height:66vh;overflow:auto}
.dbody h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--grigio);
  margin:18px 0 5px;font-weight:700}
.dbody h3:first-child{margin-top:0}
.dbody p{margin:0 0 9px;white-space:pre-wrap}
.dbody .tag{color:var(--rosso);font-weight:600}
.chiudi{position:absolute;top:12px;right:14px;border:0;background:#eceae7;width:30px;height:30px;
  border-radius:50%;font-size:17px;cursor:pointer;line-height:1;color:var(--inchiostro)}
#lente{max-width:none;width:auto;background:transparent;box-shadow:none}
#lente img{max-width:min(92vw,760px);max-height:92vh;border-radius:8px;display:block}
#vuoto{text-align:center;padding:70px 20px;color:var(--grigio)}
@media(max-width:640px){.griglia{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:11px}
  .hwrap{padding:10px 13px;gap:12px} main{padding:13px}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <h1>Approvazione post<small>AmarantoIdea · calendario editoriale</small></h1>
    <div class="filtri">
      <button data-f="tutti" aria-pressed="true">Tutti</button>
      <button data-f="daVedere" aria-pressed="false">Ancora buoni</button>
      <button data-f="scartati" aria-pressed="false">Scartati</button>
    </div>
    <button id="esporta" style="border:1px solid var(--linea);background:var(--carta);border-radius:99px;
      padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit">Scarica scartati</button>
    <div class="conta">
      <div class="c"><b id="nTot">—</b><span>totale</span></div>
      <div class="c neg"><b id="nNo">0</b><span>scartati</span></div>
    </div>
  </div>
  <div class="hwrap" style="padding-top:0"><div id="stato">Carico…</div></div>
</header>

<main><div class="griglia" id="griglia"></div><div id="vuoto" hidden>Nessun post in questo filtro.</div></main>

<dialog id="testo"><button class="chiudi" onclick="testo.close()">×</button>
  <div class="dhead"><h2 id="tTit"></h2><div class="quando" id="tQuando"></div></div>
  <div class="dbody" id="tBody"></div>
</dialog>
<dialog id="lente" onclick="lente.close()"><img id="lImg" alt=""></dialog>

<script>
const SUPABASE_URL = 'https://owkrvcfodsjzwqtipsrm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_QZqxXGa1ts4y-JwYe4QmDQ_rk6yUD_V';
const TABELLA = 'post_review';

const $ = s => document.querySelector(s);
const griglia = $('#griglia'), stato = $('#stato');
let POST = [], scarti = new Set(), filtro = 'tutti';

const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio',
              'agosto','settembre','ottobre','novembre','dicembre'];
const etichettaMese = d => {
  const [a,m] = d.split('-');
  return MESI[+m-1] + ' ' + a;
};
const dataBreve = p => {
  const g = p.data.split('-')[2];
  return (p.giorno ? p.giorno.slice(0,3) + ' ' : '') + g + ' ' + MESI[+p.data.split('-')[1]-1].slice(0,3);
};

function segna(msg, ko){ stato.textContent = msg; stato.className = ko ? 'ko' : ''; }

// Se Supabase non e' ancora configurato la pagina funziona lo stesso, salvando
// nel browser: meglio un lavoro recuperabile che una pagina che non parte.
const REMOTO = !SUPABASE_URL.startsWith('__');
const CHIAVE_LOCALE = 'scarti_post_amarantoidea';

async function sb(metodo, percorso, corpo){
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + percorso, {
    method: metodo,
    headers: {apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY,
              'Content-Type':'application/json', Prefer:'resolution=merge-duplicates'},
    body: corpo ? JSON.stringify(corpo) : undefined
  });
  if(!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

function leggiLocale(){
  try{ return new Set(JSON.parse(localStorage.getItem(CHIAVE_LOCALE) || '[]')); }
  catch(e){ return new Set(); }
}
function scriviLocale(){
  try{ localStorage.setItem(CHIAVE_LOCALE, JSON.stringify([...scarti])); }catch(e){}
}

async function caricaScarti(){
  if(!REMOTO){ scarti = leggiLocale(); return; }
  const righe = await sb('GET', TABELLA + '?select=post_n,scartato&scartato=is.true&limit=2000');
  scarti = new Set(righe.map(r => r.post_n));
}

async function salva(n, valore){
  if(!REMOTO) return;   // il salvataggio locale avviene in cambia()
  await sb('POST', TABELLA, [{post_n:n, scartato:valore, aggiornato: new Date().toISOString()}]);
}

function esporta(){
  const elenco = POST.filter(p => scarti.has(p.n))
    .map(p => ({n:p.n, data:p.data, ora:p.ora, categoria:p.cat, titolo:p.tit}));
  const b = new Blob([JSON.stringify(elenco, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'post-scartati.json';
  a.click();
}

function conta(){
  $('#nTot').textContent = POST.length;
  $('#nNo').textContent = scarti.size;
}

function disegna(){
  griglia.innerHTML = '';
  const lista = POST.filter(p =>
    filtro === 'tutti' ? true : filtro === 'scartati' ? scarti.has(p.n) : !scarti.has(p.n));
  $('#vuoto').hidden = lista.length > 0;
  let mese = '';
  const frag = document.createDocumentFragment();
  for(const p of lista){
    const m = p.data.slice(0,7);
    if(m !== mese){
      mese = m;
      const h = document.createElement('div');
      h.className = 'mese'; h.textContent = etichettaMese(p.data);
      frag.appendChild(h);
    }
    const c = document.createElement('article');
    c.className = 'card' + (scarti.has(p.n) ? ' no' : '');
    c.dataset.n = p.n;
    c.innerHTML =
      '<div class="foto"><img loading="lazy" src="' + p.url + '" alt=""><span class="num">' +
        p.i + '</span><span class="bollo">SCARTATO</span></div>' +
      '<div class="corpo">' +
        '<div class="cat"></div>' +
        '<div class="quando"><b></b> · <span></span></div>' +
        '<p class="tit"></p>' +
        '<div class="azioni">' +
          '<button class="leggi">Leggi il testo</button>' +
          '<label class="scarta"><input type="checkbox"' + (scarti.has(p.n)?' checked':'') + '> Non va bene</label>' +
        '</div>' +
      '</div>';
    c.querySelector('.cat').textContent = p.cat;
    c.querySelector('.quando b').textContent = dataBreve(p);
    c.querySelector('.quando span').textContent = p.ora;
    c.querySelector('.tit').textContent = p.tit;
    c.querySelector('.foto').onclick = () => { $('#lImg').src = p.url; lente.showModal(); };
    c.querySelector('.leggi').onclick = () => apriTesto(p);
    c.querySelector('input').onchange = e => cambia(p, e.target, c);
    frag.appendChild(c);
  }
  griglia.appendChild(frag);
  conta();
}

async function cambia(p, box, card){
  const valore = box.checked;
  box.disabled = true;
  try{
    await salva(p.n, valore);
    if(valore) scarti.add(p.n); else scarti.delete(p.n);
    if(!REMOTO) scriviLocale();
    card.classList.toggle('no', valore);
    conta();
    segna('Salvato: ' + (valore ? 'scartato' : 'rimesso buono') + ' — ' + p.tit);
    if(filtro !== 'tutti') setTimeout(disegna, 450);
  }catch(err){
    box.checked = !valore;
    segna('NON salvato, controlla la connessione: ' + err.message.slice(0,90), true);
  }finally{ box.disabled = false; }
}

function apriTesto(p){
  $('#tTit').textContent = p.tit;
  $('#tQuando').textContent = p.cat + ' · ' + dataBreve(p) + ' ' + p.data.slice(0,4) + ' alle ' + p.ora +
    (p.brand ? ' · ' + p.brand : '');
  const b = $('#tBody'); b.innerHTML = '';
  const blocco = (titolo, testo, classe) => {
    if(!testo) return;
    const h = document.createElement('h3'); h.textContent = titolo;
    const d = document.createElement('p'); d.textContent = testo; if(classe) d.className = classe;
    b.append(h, d);
  };
  blocco('Testo del post', p.txt);
  blocco('Hashtag', p.tag, 'tag');
  blocco('Commento di innesco', p.seed);
  blocco('Risposta della pagina', p.risp);
  testo.showModal();
}

$('#esporta').onclick = esporta;
document.querySelectorAll('.filtri button').forEach(b => b.onclick = () => {
  filtro = b.dataset.f;
  $('#esporta').onclick = esporta;
document.querySelectorAll('.filtri button').forEach(x => x.setAttribute('aria-pressed', x === b));
  disegna();
});

(async () => {
  try{
    POST = await fetch('data.json').then(r => r.json());
    await caricaScarti();
    disegna();
    segna(REMOTO
      ? 'Pronto. Le spunte si salvano da sole: puoi chiudere e riprendere quando vuoi.'
      : 'ATTENZIONE: salvataggio solo su questo browser. Non cancellare i dati del sito e a fine lavoro premi «Scarica scartati».', !REMOTO);
  }catch(err){
    segna('Errore di caricamento: ' + err.message.slice(0,120), true);
  }
})();
</script>
</body>
</html>
